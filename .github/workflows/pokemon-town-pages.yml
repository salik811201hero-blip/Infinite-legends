name: Deploy Pokémon Town browser prototype

on:
  push:
    branches:
      - feature/infinite-legends-0.1
    paths:
      - "infinite_legends/prototype/pokemon-town/**"
      - ".github/workflows/pokemon-town-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pokemon-town-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload town prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: infinite_legends/prototype/pokemon-town
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
